[jira]
base_url = "https://issues.apache.org/jira"
api = "auto"
project = "KAFKA"
# По умолчанию загружаются ВСЕ задачи выбранного проекта.
# Необязательный фильтр, например: jql = "project = KAFKA AND created >= -90d ORDER BY created ASC"
closed_status_names = ["Закрыта", "Done", "Closed", "Resolved"]
severity_field = "priority"
utc_offset_hours = 3
timeout_seconds = 60
retries = 3
page_size = 100
